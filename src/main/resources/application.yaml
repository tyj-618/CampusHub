spring:
  application:
    name: CampusHub

  datasource:
    url: ${CAMPUSHUB_DB_URL:jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CAMPUSHUB_DB_USERNAME:root}
    password: ${CAMPUSHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${CAMPUSHUB_REDIS_HOST:localhost}
      port: ${CAMPUSHUB_REDIS_PORT:6379}
      password: ${CAMPUSHUB_REDIS_PASSWORD:}
      database: ${CAMPUSHUB_REDIS_DATABASE:0}

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

campushub:
  cache:
    hot-post-ttl-seconds: ${CAMPUSHUB_HOT_POST_TTL_SECONDS:300}
    hot-post-ttl-jitter-seconds: ${CAMPUSHUB_HOT_POST_TTL_JITTER_SECONDS:60}
  view-count:
    flush-interval-seconds: ${CAMPUSHUB_VIEW_COUNT_FLUSH_INTERVAL_SECONDS:10}
