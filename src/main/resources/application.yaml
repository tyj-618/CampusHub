spring:
  application:
    name: CampusHub

  datasource:
    url: ${CAMPUSHUB_DB_URL:jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${CAMPUSHUB_DB_USERNAME:root}
    password: ${CAMPUSHUB_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
